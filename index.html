<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Golf Scorecard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>⛳ Golf Scorecard</h1>
    <p>Enter your round and track your score</p>
  </header>

  <main class="container">

    <!-- PLAYER -->
    <div class="card">
      <h2>1. Your Name</h2>

      <label for="playerName">Name</label>

      <input
        type="text"
        id="playerName"
        placeholder="Enter your name"
      >
    </div>


    <!-- COURSE -->
    <div class="card">
      <h2>2. Select Your Course</h2>

      <label for="course">Course</label>

      <select id="course">
        <option value="">Loading courses...</option>
      </select>
    </div>


    <!-- TEE -->
    <div class="card">
      <h2>3. Select Your Tee</h2>

      <label for="tee">Tee</label>

      <select id="tee">
        <option value="">Select a course first</option>
      </select>
    </div>


    <!-- SCORECARD -->
    <div class="card">

      <h2>4. Enter Your Scores</h2>

      <div id="scorecard">
        <p>
          Select a course and tee above to begin.
        </p>
      </div>

    </div>


    <!-- SUBMIT -->
    <div class="card">

      <button id="submitRound">
        Submit Round
      </button>

      <p id="submitMessage"></p>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
